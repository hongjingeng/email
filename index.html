<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>114.ae跨境 - 临时邮箱 阅后即焚</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #5b6e8c;
            --border-color: #e9eef3;
            --accent-color: #1e3c72;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --marquee-bg: rgba(255, 255, 255, 0.15);
            --result-bg: rgba(30, 60, 114, 0.05);
            --tag-bg: #eef2ff;
        }
        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #60a5fa;
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(255, 255, 255, 0.1);
            --marquee-bg: rgba(0, 0, 0, 0.3);
            --result-bg: rgba(96, 165, 250, 0.1);
            --tag-bg: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s;
        }
        .marquee-container {
            position: fixed; top: 0; left: 0; width: 100%;
            background: var(--marquee-bg); backdrop-filter: blur(12px);
            padding: 8px 0; z-index: 100; border-bottom: 1px solid var(--glass-border);
            overflow: hidden;
        }
        .marquee {
            white-space: nowrap; display: inline-block;
            animation: marquee 22s linear infinite;
        }
        .marquee a {
            color: var(--text-primary); font-weight: bold; text-decoration: none;
            padding: 0 30px; font-size: 15px; display: inline-block;
            background: rgba(255,255,255,0.2); border-radius: 30px; margin: 0 5px;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* 版权联系 - 紧挨跑马灯下方 */
        .copyright-bar {
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 8px 0;
            font-size: 0.95rem;
            text-align: center;
            position: fixed;
            top: 44px;
            left: 0;
            width: 100%;
            z-index: 99;
            border-bottom: 1px solid var(--accent-color);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 110px 20px 40px; }
        .search-header {
            background: var(--card-bg); border-radius: 32px;
            padding: 32px 40px; margin-bottom: 24px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .avatar {
            width: 90px; height: 90px; border-radius: 50%;
            margin: 15px auto; border: 4px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            font-size: 3.5rem; display: flex; align-items: center; justify-content: center;
            background: #1e3c72; color: #60a5fa;
        }
        h1 {
            font-size: 2.3rem; font-weight: 700;
            background: linear-gradient(135deg, #00b4ff, #00ff9d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .mail-display {
            background: var(--result-bg); padding: 18px 24px;
            border-radius: 60px; font-family: monospace;
            font-size: 1.15rem; font-weight: 600; margin: 20px 0;
            color: var(--text-primary); border: 2px solid var(--accent-color);
            min-height: 58px; display: flex; align-items: center; justify-content: center;
            word-break: break-all;
        }
        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn {
            min-width: 130px; padding: 13px 26px; border-radius: 60px;
            border: none; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-p { background: var(--accent-color); color: white; }
        .btn-s { background: var(--tag-bg); color: var(--text-primary); }
        .btn:active { transform: scale(0.97); }

        .results-container {
            background: var(--card-bg); border-radius: 32px;
            padding: 24px; border: 1px solid var(--border-color);
            min-height: 320px;
        }
        .results-title {
            font-size: 0.95rem; color: var(--text-secondary);
            margin-bottom: 20px; padding-left: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .msg-item {
            background: var(--result-bg); border-radius: 20px;
            padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color);
            transition: 0.2s; cursor: pointer;
        }
        .msg-item:hover { transform: translateY(-3px); border-color: var(--accent-color); }
        .msg-meta { font-size: 0.8rem; color: var(--accent-color); font-weight: bold; margin-bottom: 6px; }
        .msg-subject { font-weight: 700; font-size: 1.05rem; color: var(--text-primary); }

        .theme-toggle {
            position: fixed; top: 70px; right: 20px; width: 48px; height: 48px;
            border-radius: 50%; background: var(--card-bg);
            border: 1px solid var(--border-color); display: flex;
            align-items: center; justify-content: center; cursor: pointer; z-index: 101;
        }
        .music-player { position: fixed; bottom: 25px; right: 25px; z-index: 102; }
        .music-toggle {
            width: 55px; height: 55px; border-radius: 50%;
            background: var(--card-bg); border: 2px solid var(--accent-color);
            display: flex; align-items: center; justify-content: center; font-size: 26px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .music-toggle.playing { animation: rotate 3.5s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .container { padding-top: 100px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- 跑马灯广告 -->
    <div class="marquee-container">
        <div class="marquee">
            <a href="#" target="_blank">🚀 114.ae跨境临时邮箱 · 隐私保护 · 阅后即焚 · 支持验证码接收 · 防骚扰</a>
            <a href="#" target="_blank">🚀 114.ae跨境临时邮箱 · 隐私保护 · 阅后即焚 · 支持验证码接收 · 防骚扰</a>
        </div>
    </div>

    <!-- 版权联系（紧挨跑马灯下方） -->
    <div class="copyright-bar">
        © 114.ae跨境临时邮箱 | TG: @your_tg | WhatsApp: +65 你的号码
    </div>

    <div class="theme-toggle" id="themeToggle">🌙</div>

    <div class="container">
        <div class="search-header">
            <div class="avatar">🛸</div>
            <h1>114.ae跨境</h1>
            <p style="color: var(--text-secondary); font-size: 1rem; margin: 8px 0 15px;">114.ae临时邮箱 阅后即焚</p>
            
            <div id="addr" class="mail-display">点击“更换地址”生成邮箱...</div>
            
            <div class="btn-group">
                <button onclick="copyMail()" class="btn btn-s">📋 复制地址</button>
                <button id="refreshBtn" onclick="init()" class="btn btn-p">🔄 更换地址</button>
            </div>
        </div>

        <div class="results-container">
            <div class="results-title">📥 实时收件箱 (仅存留于当前页面，刷新即焚)</div>
            <div id="list">
                <div style="text-align: center; padding: 80px; color: var(--text-secondary);">等待新邮件推送中...</div>
            </div>
        </div>
    </div>

    <div class="music-player">
        <div class="music-toggle" id="musicToggle">💿</div>
    </div>
    <audio id="bgm" loop preload="auto" src="https://files.catbox.moe/0oluxu.flac"></audio>

    <script>
        const API_KEY = 'vmail_at6AmSu4dEkuJG4bafc8qhSqBctCMW9q';
        const PROXY = 'https://proxy.api.030101.xyz/https://vmail.dev/api/v1';
        let mid = null;
        let isInitializing = false;

        // 主题切换
        document.getElementById('themeToggle').onclick = function() {
            document.body.classList.toggle('dark');
            this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        };

        // 音乐控制
        const music = document.getElementById('bgm');
        const mBtn = document.getElementById('musicToggle');
        mBtn.onclick = (e) => {
            e.stopPropagation();
            if (music.paused) {
                music.play();
                mBtn.classList.add('playing');
            } else {
                music.pause();
                mBtn.classList.remove('playing');
            }
        };

        // 自动播放音乐（用户交互后）
        function autoPlayMusic() {
            music.play().then(() => {
                mBtn.classList.add('playing');
                document.removeEventListener('click', autoPlayMusic);
                document.removeEventListener('touchstart', autoPlayMusic);
            }).catch(() => {});
        }

        // 生成新邮箱（带重试机制）
        async function init(retries = 3) {
            if (isInitializing) return;
            isInitializing = true;
            const addrEl = document.getElementById('addr');
            const listEl = document.getElementById('list');
            const btn = document.getElementById('refreshBtn');

            addrEl.innerText = "⚡ 正在生成随机邮箱...";
            btn.disabled = true;
            listEl.innerHTML = '<div style="text-align: center; padding: 80px; color: var(--text-secondary);">🚀 生成中，请稍候...</div>';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);

                const r = await fetch(`${PROXY}/mailboxes`, {
                    method: 'POST',
                    headers: {
                        'X-API-Key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!r.ok) throw new Error('API 请求失败');

                const { data } = await r.json();
                mid = data.id;
                addrEl.innerText = data.address;
                listEl.innerHTML = '<div style="text-align: center; padding: 80px; color: var(--text-secondary);">✅ 邮箱已生成，正在监听新邮件...</div>';
            } catch (e) {
                console.error(e);
                if (retries > 0) {
                    addrEl.innerText = `生成失败，正在重试(${retries})...`;
                    setTimeout(() => init(retries - 1), 1200);
                } else {
                    addrEl.innerText = "⚠️ 生成失败，请点击“更换地址”重试";
                    listEl.innerHTML = '<div style="text-align: center; padding: 60px; color: #ef4444;">网络或代理问题，请稍后重试</div>';
                }
            } finally {
                isInitializing = false;
                btn.disabled = false;
            }
        }

        // 刷新收件箱
        async function refresh() {
            if (!mid || isInitializing) return;
            try {
                const r = await fetch(`${PROXY}/mailboxes/${mid}/messages`, {
                    headers: { 'X-API-Key': API_KEY }
                });
                const { data } = await r.json();
                const box = document.getElementById('list');

                if (data.length === 0) {
                    box.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-secondary);">暂无新邮件...</div>';
                    return;
                }

                box.innerHTML = data.map(m => `
                    <div class="msg-item" onclick="showMailPreview('${m.preview || '无预览内容'}', '${m.subject || '无主题'}')">
                        <div class="msg-meta">来自: ${m.from ? m.from.address : '未知'} | ${new Date(m.receivedAt).toLocaleString()}</div>
                        <div class="msg-subject">${m.subject || '（无主题）'}</div>
                        <div style="font-size:0.85rem; color:var(--text-secondary); margin-top:8px;">${m.preview || ''}...</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        function showMailPreview(preview, subject) {
            alert(`主题: ${subject}\n\n预览: ${preview}\n\n（完整正文需后端支持，此处为简化预览）`);
        }

        function copyMail() {
            const val = document.getElementById('addr').innerText;
            if (val.includes('@')) {
                navigator.clipboard.writeText(val).then(() => {
                    alert('✅ 复制成功！注意：刷新页面后地址将失效（阅后即焚）');
                });
            } else {
                alert('地址尚未准备好，请点击“更换地址”生成');
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            init();
            setInterval(refresh, 4500);   // 每4.5秒自动刷新

            // 音乐自动播放
            autoPlayMusic();
            document.addEventListener('click', autoPlayMusic, { once: true });
            document.addEventListener('touchstart', autoPlayMusic, { once: true });
        });
    </script>
</body>
</html>
